[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."scheduled-calendar-sync"]
  schedule = "*/30 * * * *"

[functions."send-wednesday-checkins"]
  schedule = "0 20 * * 3"

[functions."send-lesson-recap"]
  schedule = "0 20 * * 1"

[functions."process-scheduled-notifications"]
  schedule = "*/10 * * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

