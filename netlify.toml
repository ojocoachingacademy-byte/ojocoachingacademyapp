[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."scheduled-calendar-sync"]
  schedule = "*/30 * * * *"

[functions."send-wednesday-checkins"]
  schedule = "0 20 * * 3"  # 12pm PST (8pm UTC) - adjust timezone as needed

[functions."send-lesson-recap"]
  schedule = "0 2 * * 1"  # 6pm PST Sunday (2am UTC Monday) - adjust timezone as needed

[functions."process-scheduled-notifications"]
  schedule = "*/10 * * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

